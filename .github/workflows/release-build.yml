name: Release Build

on:
    workflow_call:
        inputs:
            ref:
                description: Git ref to build (usually the release tag).
                required: true
                type: string
            tag_name:
                description: Release tag the bundles are uploaded to.
                required: true
                type: string
    workflow_dispatch:
        inputs:
            ref:
                description: Git ref to build (usually the release tag).
                required: true
                type: string
            tag_name:
                description: Release tag the bundles are uploaded to.
                required: true
                type: string

permissions:
    contents: write

env:
    CARGO_TERM_COLOR: always

jobs:
    # One universal build rather than one per arch: an Apple Silicon user who
    # picks an Intel-only download runs everything under Rosetta.
    macos:
        name: macOS (universal)
        runs-on: macos-latest
        env:
            TARGET: universal-apple-darwin
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            # No version pin: the action reads packageManager from package.json,
            # which must stay the only place the pnpm version is declared.
            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  cache: pnpm
                  node-version: '22'

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            - uses: swatinem/rust-cache@v2
              with:
                  key: universal-apple-darwin
                  workspaces: src-tauri -> target

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The bundler signs whenever APPLE_CERTIFICATE is *present*, so
            # the variable cannot be set at all on the unsigned path: an unset
            # secret expands to "" and fails `security import` on an empty .p12.
            # Hence two build steps rather than one with a conditional env.
            - name: Check for Apple signing secrets
              id: signing
              env:
                  CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
              run: |
                  if [ -n "$CERTIFICATE" ]; then
                    echo 'enabled=true' >> "$GITHUB_OUTPUT"
                  else
                    echo 'enabled=false' >> "$GITHUB_OUTPUT"
                  fi

            - name: Build Tauri bundles (signed and notarized)
              if: steps.signing.outputs.enabled == 'true'
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: pnpm tauri build --target ${{ env.TARGET }} --bundles app,dmg

            # Ad-hoc signed, so Gatekeeper shows the unidentified-developer
            # prompt; adding the six repository secrets is the only step needed
            # to take the signed path instead.
            - name: Build Tauri bundles (unsigned)
              if: steps.signing.outputs.enabled == 'false'
              run: pnpm tauri build --target ${{ env.TARGET }} --bundles app,dmg

            - name: Upload to release
              uses: softprops/action-gh-release@v2
              with:
                  fail_on_unmatched_files: true
                  files: src-tauri/target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
                  tag_name: ${{ inputs.tag_name }}
